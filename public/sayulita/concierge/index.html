<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sayulita AI Concierge</title>
<meta name="description" content="What YouTube visitors keep recommending in Sayulita and San Pancho, summarized by AI from a year of comments. Updated monthly.">
<meta name="theme-color" content="#e8553d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #fff8ef; --card: #ffffff; --ink: #2a1f1a; --muted: #7a6a5f; --line: #f0e2d2;
  --sun: #e8553d; --sea: #138a8a; --lime: #7cb342; --gold: #f2b134; --pink: #e05c9b;
  --shadow: 0 1px 2px rgba(60,30,10,.06), 0 4px 14px rgba(60,30,10,.06);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1a1412; --card: #251d1a; --ink: #f6ece2; --muted: #b3a196; --line: #3a2e29;
    --shadow: 0 1px 2px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"] {
  --bg: #1a1412; --card: #251d1a; --ink: #f6ece2; --muted: #b3a196; --line: #3a2e29;
  --shadow: 0 1px 2px rgba(0,0,0,.3);
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 16px/1.5 Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
.wrap { max-width: 640px; margin: 0 auto; padding: 0 16px 48px; }
.flags { height: 22px; background:
  linear-gradient(135deg, transparent 50%, var(--bg) 50%) 0 0/22px 22px,
  linear-gradient(90deg, var(--sun) 0 20%, var(--gold) 20% 40%, var(--lime) 40% 60%, var(--sea) 60% 80%, var(--pink) 80%) 0 0/110px 22px; }
header { padding: 22px 0 8px; }
h1 { font-family: Fraunces, Georgia, serif; font-weight: 800; font-size: clamp(34px, 9vw, 48px); line-height: 1; margin: 0; letter-spacing: -.02em; }
h1 span { color: var(--sun); }
.sub { color: var(--muted); margin: 8px 0 0; font-size: 15px; }
.stamp { display: inline-block; margin-top: 10px; font-size: 13px; color: var(--muted); }
.stamp b { color: var(--sea); font-weight: 600; }
h2 { font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: 22px; margin: 30px 0 10px; display: flex; align-items: baseline; gap: 8px; }
h2 small { font: 500 13px Inter, sans-serif; color: var(--muted); }
.cash { margin-top: 18px; background: linear-gradient(135deg, var(--sea), #0e6b6b); color: #fff; border-radius: 16px; padding: 16px 18px; box-shadow: var(--shadow); }
.cash .k { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; opacity: .85; font-weight: 600; }
.cash p { margin: 4px 0 0; font-size: 17px; font-weight: 500; }
.list { display: grid; gap: 10px; }
.item { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; box-shadow: var(--shadow); display: grid; grid-template-columns: 64px 1fr; gap: 12px; align-items: start; }
.when { text-align: center; border-radius: 10px; padding: 6px 2px; background: color-mix(in srgb, var(--sun) 12%, transparent); color: var(--sun); font-weight: 600; font-size: 13px; line-height: 1.2; }
.when b { display: block; font-family: Fraunces, Georgia, serif; font-size: 20px; }
.hh .when { background: color-mix(in srgb, var(--gold) 20%, transparent); color: #a86d00; }
:root[data-theme="dark"] .hh .when { color: var(--gold); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .hh .when { color: var(--gold); } }
.fest .when { background: color-mix(in srgb, var(--pink) 14%, transparent); color: var(--pink); }
.t { font-weight: 600; margin: 0; overflow-wrap: anywhere; }
.m { color: var(--muted); font-size: 14px; margin: 2px 0 0; overflow-wrap: anywhere; }
.m a { color: var(--sea); }
.tag { display: inline-block; font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; padding: 1px 7px; border-radius: 99px; background: var(--line); color: var(--muted); margin-left: 4px; vertical-align: 1px; }
a.jaibos { margin-top: 10px; color: inherit; text-decoration: none; border-color: color-mix(in srgb, var(--sun) 40%, var(--line)); }
a.jaibos .when { background: color-mix(in srgb, var(--sea) 12%, transparent); color: var(--sea); }
.tabs { display: flex; gap: 6px; margin: 0 0 10px; overflow-x: auto; scrollbar-width: none; }
.tabs button { flex: 0 0 auto; font: 600 14px Inter, sans-serif; color: var(--muted); background: var(--card); border: 1px solid var(--line); border-radius: 99px; padding: 7px 13px; cursor: pointer; }
.tabs button[aria-selected="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.tabs button span { opacity: .6; font-weight: 500; margin-left: 3px; }
.prog { margin: 8px 0 0; padding: 0; list-style: none; border-top: 1px solid var(--line); }
.prog li { display: grid; grid-template-columns: 58px 1fr; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.prog li b { color: var(--pink); font-weight: 600; }
.prog li.d { display: block; font-weight: 600; color: var(--ink); padding-top: 10px; border: 0; }
details summary { cursor: pointer; color: var(--sea); font-size: 14px; margin-top: 6px; }
.tag.on { background: var(--pink); color: #fff; }
.list .sub { font-size: 13px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); margin: 8px 2px 0; }
.empty { color: var(--muted); font-size: 15px; background: var(--card); border: 1px dashed var(--line); border-radius: 14px; padding: 14px; }
footer { margin-top: 36px; color: var(--muted); font-size: 13px; text-align: center; }
footer a { color: var(--sea); }
.beach { margin-top: 18px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.tile { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; box-shadow: var(--shadow); min-width: 0; }
.tile .k { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.tile b { display: block; font-family: Fraunces, Georgia, serif; font-size: 19px; margin-top: 2px; }
.tile small { display: block; color: var(--muted); font-size: 13px; }
header { position: relative; }
.lang { position: absolute; top: 22px; right: 0; font: 600 13px Inter, sans-serif; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 99px; padding: 6px 12px; cursor: pointer; }

header h1 { padding-right: 58px; font-size: clamp(32px, 8vw, 46px); }
.back { display: inline-block; margin-top: 16px; font-size: 14px; color: var(--sea); text-decoration: none; font-weight: 600; }
.intro { margin: 14px 0 0; font-size: 16px; }
.rank { background: color-mix(in srgb, var(--sea) 12%, transparent); color: var(--sea); }
.rank b { font-size: 22px; }
.warn .when { background: color-mix(in srgb, var(--sun) 12%, transparent); color: var(--sun); }
.tag.miss { background: var(--gold); color: #3a2600; }
.plan { margin-top: 18px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); overflow: hidden; }
.plan .top { padding: 14px 16px 10px; background: linear-gradient(135deg, var(--sea), #0e6b6b); color: #fff; }
.plan .top .k { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; opacity: .85; font-weight: 600; }
.plan .top h3 { margin: 4px 0 2px; font: 700 20px/1.2 Fraunces, Georgia, serif; }
.plan .top p { margin: 0; font-size: 14px; opacity: .92; }
.stop { display: grid; grid-template-columns: 58px 1fr; gap: 10px; padding: 12px 16px; border-top: 1px solid var(--line); }
.stop:first-of-type { border-top: 0; }
.stop .tm { font-weight: 700; font-size: 13px; color: var(--sun); line-height: 1.25; }
.stop .tm small { display: block; font-weight: 500; color: var(--muted); font-size: 11px; text-transform: capitalize; }
.stop .p { font-weight: 700; margin: 0; }
.stop .w { margin: 2px 0 0; font-size: 14px; color: var(--muted); }
.stop .o { margin: 6px 0 0; font-size: 13px; background: color-mix(in srgb, var(--gold) 16%, transparent); border-radius: 8px; padding: 5px 8px; }
.stop .sw { margin-top: 6px; background: none; border: 0; padding: 0; color: var(--sea); font: 600 13px Inter, sans-serif; cursor: pointer; }
.stop.alt { background: color-mix(in srgb, var(--sea) 7%, transparent); }
.orders { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
.orders span { font-size: 12px; font-weight: 600; padding: 3px 8px; border-radius: 99px; background: color-mix(in srgb, var(--gold) 22%, transparent); }
.orders span b { font-weight: 500; opacity: .7; margin-left: 3px; }
.lk { margin: 6px 0 0; display: flex; flex-wrap: wrap; gap: 6px; }
.lk a { font-size: 12px; font-weight: 600; text-decoration: none; padding: 4px 9px; border-radius: 99px; border: 1px solid var(--line); color: var(--sea); background: var(--card); }
.q { margin: 6px 0 0; font-size: 13px; font-style: italic; color: var(--ink); border-left: 3px solid var(--line); padding-left: 8px; }
.how { margin-top: 28px; background: var(--card); border: 1px dashed var(--line); border-radius: 14px; padding: 12px 14px; color: var(--muted); font-size: 14px; }
</style>
</head>
<body>
<div class="flags" aria-hidden="true"></div>
<main class="wrap">
  <header>
    <button class="lang" id="lang" type="button" aria-label="Español">ES</button>
    <h1>🤖 <span data-i="h1a" style="color:var(--ink)"></span> <span data-i="h1b" style="color:var(--sun)"></span></h1>
    <p class="sub" data-i="sub"></p>
    <span class="stamp" id="stamp">Loading…</span>
    <p class="intro" id="intro"></p>
    <a class="back" href="/sayulita/index.html" data-i="back"></a>
  </header>

  <section class="plan" id="plan" hidden></section>

  <h2 data-i="picks"></h2>
  <div class="tabs" role="tablist" id="catTabs"></div>
  <div class="list" id="picks"></div>

  <h2 data-i="tips"></h2>
  <div class="list" id="tips"></div>

  <h2 data-i="warn" id="warnH"></h2>
  <div class="list warn" id="warns"></div>

  <div class="how" data-i="how"></div>
  <footer><a href="/sayulita/index.html" data-i="back"></a> · <a href="/projects">whistlerbrew.com</a></footer>
</main>
<script>
(function () {
  var UI = {
    en: { h1a: "Sayulita", h1b: "AI Concierge", sub: "What visitors keep recommending in Sayulita and San Pancho, from a year of YouTube and Reddit comments.",
      back: "← Sayulita today", planK: "Today's plan", swap: "Not feeling it? Swap →", back2: "← Back to the plan", order: "Order", web: "🌐 Website", ig: "📷 Instagram", maps: "📍 Google Maps", sl: "Sayulita Life", reviews: "Google reviews", street: "🌮 Street food",
      picks: "Top picks", tips: "Insider tips", warn: "Locals would skip", skipN: "{c} would skip", likeN: "{f} like it", skipNote: "Fair-game gripes only (price, taste, service). Two or more different people, in their own words.", all: "All", eat: "Food & drinks",
      sea: "Surf & beaches", more: "Outdoors & more", people: "people recommend", said: "people said this", critics: "warn about it", last: "last mentioned",
      miss: "Not on Sayulita Today", directions: "directions", updated: "Updated", empty: "The concierge is reading comments. Check back soon.",
      none: "Nothing here yet.", stats: "{y} YouTube and {r} Reddit comments",
      how: "How this works: once a month we read new comments from the past 12 months on YouTube travel videos and in r/sayulita and r/mexicotravel. AI pulls out the places and tips people recommend from their own visits. A place only shows here when at least 3 different people mention it, and recent comments count more. Creator comments and links are ignored. Always check hours with the venue." },
    es: { h1a: "Tu Conserje", h1b: "IA de Sayulita", sub: "Lo que los visitantes siempre recomiendan en Sayulita y San Pancho, según un año de comentarios en YouTube y Reddit.",
      back: "← Sayulita hoy", planK: "El plan de hoy", swap: "¿No se te antoja? Cambia →", back2: "← Volver al plan", order: "Pide", web: "🌐 Sitio web", ig: "📷 Instagram", maps: "📍 Google Maps", sl: "Sayulita Life", reviews: "reseñas en Google", street: "🌮 Comida callejera",
      picks: "Los favoritos", tips: "Tips de la gente", warn: "Lo que los locales evitarían", skipN: "{c} lo evitarían", likeN: "a {f} les gusta", skipNote: "Sólo quejas justas (precio, sabor, servicio). Dos o más personas distintas, con sus propias palabras.", all: "Todo", eat: "Comida y bebidas",
      sea: "Surf y playas", more: "Naturaleza y más", people: "personas lo recomiendan", said: "personas lo dijeron", critics: "advierten", last: "última mención",
      miss: "No está en Sayulita Hoy", directions: "cómo llegar", updated: "Actualizado", empty: "El conserje está leyendo comentarios. Vuelve pronto.",
      none: "Nada por aquí todavía.", stats: "{y} comentarios de YouTube y {r} de Reddit",
      how: "Cómo funciona: una vez al mes leemos los comentarios nuevos de los últimos 12 meses en videos de viaje de YouTube y en r/sayulita y r/mexicotravel. La IA saca los lugares y tips que la gente recomienda por experiencia propia. Un lugar sólo aparece si al menos 3 personas distintas lo mencionan, y los comentarios recientes cuentan más. Se ignoran los comentarios de los creadores y los links. Confirma horarios con el lugar." }
  };
  var LANG = "en"; try { LANG = localStorage.getItem("sy-lang") === "es" ? "es" : "en"; } catch (e) {}
  function T(k) { return UI[LANG][k] || UI.en[k] || k; }
  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]; }); }
  var IOS = /iPad|iPhone|iPod|Macintosh/.test(navigator.userAgent) && "ontouchend" in document;
  function go(p) {
    var q = encodeURIComponent(p.name + ", " + (p.town === "San Pancho" ? "San Pancho" : "Sayulita") + ", Nayarit");
    var u = IOS ? "https://maps.apple.com/?daddr=" + q : "https://www.google.com/maps/dir/?api=1&destination=" + q;
    return ' · <a href="' + u + '" rel="noopener" target="_blank">' + esc(T("directions")) + "</a>";
  }
  function month(ym) { try { return new Date(ym + "-15T12:00:00").toLocaleDateString(LANG === "es" ? "es-MX" : "en-US", { month: "short", year: "numeric" }); } catch (e) { return ym; } }
  function blurb(p) { return LANG === "es" ? (p.es || p.en) : (p.en || p.es); }
  var GROUP = { food: "eat", drinks: "eat", surf: "sea", beach: "sea" };
  function group(p) { return GROUP[p.category] || "more"; }
  var D = null, cat = "all";
  try { cat = localStorage.getItem("sy-cc") || "all"; } catch (e) {}
  function fill(el, items, row) { el.innerHTML = items.length ? items.map(row).join("") : '<div class="empty">' + esc(T("none")) + "</div>"; }
  function pickRow(p, i) {
    var town = p.town && p.town !== "Sayulita" ? ' <span class="tag">' + esc(p.town) + "</span>" : "";
    var price = p.price ? ' <span class="tag">' + esc(p.price) + "</span>" : "";
    var orders = (p.orders || []).length ? '<div class="orders">' + p.orders.map(function (o) {
      return "<span>" + esc(o.item) + (o.people > 1 ? "<b>×" + o.people + "</b>" : "") + "</span>"; }).join("") + "</div>" : "";
    var meta = [p.vibe, p.when].filter(Boolean).join(" · ");
    return '<article class="item"><div class="when rank">#<b>' + (i + 1) + '</b></div><div><p class="t">' + esc(p.name) + town + price +
      '</p><p class="m">' + esc(blurb(p)) + "</p>" + (meta ? '<p class="m">' + esc(meta) + "</p>" : "") + orders +
      (p.quote ? '<p class="q">“' + esc(p.quote) + '”</p>' : "") +
      '<p class="m">👥 ' + p.fans + " " + esc(T("people")) + (p.google ? " · ⭐ " + p.google.rating + " (" + (p.google.reviews || 0).toLocaleString() + " " + esc(T("reviews")) + ")" : "") +
      " · " + esc(T("last")) + " " + esc(month(p.last)) + "</p>" + linkRow(p) + "</div></article>";
  }
  function linkRow(p) {
    var l = p.links || {}, out = [];
    out.push('<a href="' + esc(l.maps || mapsUrl(p)) + '" rel="noopener" target="_blank">' + esc(T("maps")) + "</a>");
    if (/^https:\/\//.test(l.web || "")) out.push('<a href="' + esc(l.web) + '" rel="noopener" target="_blank">' + esc(T("web")) + "</a>");
    if (/^https:\/\//.test(l.ig || "")) out.push('<a href="' + esc(l.ig) + '" rel="noopener" target="_blank">' + esc(T("ig")) + "</a>");
    if (/^https:\/\//.test(l.sl || "")) out.push('<a href="' + esc(l.sl) + '" rel="noopener" target="_blank">' + esc(T("sl")) + "</a>");
    return '<div class="lk">' + out.join("") + "</div>";
  }
  function mapsUrl(p) { return "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(p.name + ", " + (p.town === "San Pancho" ? "San Pancho" : "Sayulita") + ", Nayarit"); }
  var PLAN = null, swapped = {};
  function L(o, k) { return o ? (LANG === "es" ? (o[k + "_es"] || o[k + "_en"]) : (o[k + "_en"] || o[k + "_es"])) || "" : ""; }
  function time12(t) { if (!t) return ""; var a = t.split(":"), h = +a[0]; return LANG === "es" ? h + ":" + a[1] : (h % 12 || 12) + (a[1] === "00" ? "" : ":" + a[1]) + (h < 12 ? "am" : "pm"); }
  function stopHtml(s, n) {
    var alt = swapped[n] && s.swap && s.swap.place, x = alt ? s.swap : s;
    return '<div class="stop' + (alt ? " alt" : "") + '"><div class="tm">' + esc(time12(s.time)) + "<small>" + esc(s.kind || "") + '</small></div><div><p class="p">' +
      esc(L(x, "title") || x.place) + '</p><p class="w">' + esc(x.place) + " · " + esc(L(x, "why")) + pinFor(x.place) + "</p>" +
      (!alt && L(s, "order") ? '<p class="o">🍽️ ' + esc(T("order")) + ": " + esc(L(s, "order")) + "</p>" : "") +
      (s.swap && s.swap.place ? '<button class="sw" type="button" data-n="' + n + '">' + esc(alt ? T("back2") : T("swap")) + "</button>" : "") + "</div></div>";
  }
  function pinFor(name) {
    var all = D ? (D.picks || []).concat(D.street || []) : [], n = (name || "").toLowerCase();
    var p = all.filter(function (q) { var m = q.name.toLowerCase(); return m === n || m.indexOf(n) === 0 || n.indexOf(m) === 0; })[0];
    var u = p && p.links && p.links.maps ? p.links.maps : mapsUrl({ name: name });
    return ' · <a href="' + esc(u) + '" rel="noopener" target="_blank">' + esc(T("directions")) + "</a>";
  }
  function drawPlan() {
    var today = new Intl.DateTimeFormat("en-CA", { timeZone: "America/Mexico_City" }).format(new Date());
    if (!PLAN || PLAN.date !== today || !(PLAN.stops || []).length) { $("plan").hidden = true; return; }
    $("plan").innerHTML = '<div class="top"><div class="k">🗓️ ' + esc(T("planK")) + "</div><h3>" + esc(L(PLAN, "headline")) + "</h3><p>" + esc(L(PLAN, "weather")) + "</p></div>" +
      PLAN.stops.map(stopHtml).join("");
    $("plan").hidden = false;
  }
  function skipRow(p) {
    var why = (p.reasons || []).join(", ");
    var counts = T("skipN").replace("{c}", p.critics) + (p.fans ? " · " + T("likeN").replace("{f}", p.fans) : "");
    return '<article class="item"><div class="when">🤔</div><div><p class="t">' + esc(p.name) + "</p>" + (why ? '<p class="m">' + esc(why) + "</p>" : "") +
      (p.quotes || []).map(function (q) { return '<p class="q">“' + esc(q) + '”</p>'; }).join("") +
      '<p class="m">👥 ' + esc(counts) + " · " + esc(T("last")) + " " + esc(month(p.last)) + "</p></div></article>";
  }
  function warnRow(p) {
    return '<article class="item"><div class="when">⚠️</div><div><p class="t">' + esc(p.name) + '</p><p class="m">' + esc(blurb(p)) +
      '</p><p class="m">👥 ' + p.critics + " " + esc(T("critics")) + " · " + esc(T("last")) + " " + esc(month(p.last)) + "</p></div></article>";
  }
  function tipRow(t) {
    return '<article class="item"><div class="when">' + (t.category === "warning" ? "⚠️" : "💡") + '</div><div><p class="t" style="font-weight:500">' +
      esc(LANG === "es" ? (t.es || t.en) : t.en) + "</p>" + (t.quote ? '<p class="q">“' + esc(t.quote) + '”</p>' : "") +
      (t.people ? '<p class="m">👥 ' + t.people + " " + esc(T("said")) + "</p>" : "") + "</div></article>";
  }
  function render() {
    document.documentElement.lang = LANG;
    $("lang").textContent = LANG === "es" ? "EN" : "ES";
    Array.prototype.forEach.call(document.querySelectorAll("[data-i]"), function (el) { el.textContent = T(el.getAttribute("data-i")); });
    if (!D) { $("stamp").textContent = ""; $("picks").innerHTML = '<div class="empty">' + esc(T("empty")) + "</div>"; return; }
    var s = D.stats || {};
    $("stamp").innerHTML = esc(T("updated")) + " <b>" + esc(month((D.updated || "").slice(0, 7))) + "</b> · " +
      esc(T("stats").replace("{y}", (s.youtube || 0).toLocaleString()).replace("{r}", (s.reddit || 0).toLocaleString()));
    $("intro").textContent = (D.intro && (D.intro[LANG] || D.intro.en)) || "";
    drawPlan();
    var keys = ["all", "street", "eat", "sea", "more"], picks = D.picks || [];
    $("catTabs").innerHTML = keys.map(function (k) {
      var n = k === "all" ? picks.length : k === "street" ? (D.street || []).length : picks.filter(function (p) { return group(p) === k; }).length;
      return '<button role="tab" data-k="' + k + '" aria-selected="' + (k === cat) + '">' + esc(T(k)) + "<span>" + n + "</span></button>";
    }).join("");
    Array.prototype.forEach.call($("catTabs").children, function (b) { b.onclick = function () { cat = b.getAttribute("data-k"); try { localStorage.setItem("sy-cc", cat); } catch (e) {} render(); }; });
    fill($("picks"), cat === "street" ? (D.street || []) : picks.filter(function (p) { return cat === "all" || group(p) === cat; }).slice(0, 25), pickRow);
    fill($("tips"), D.tips || [], tipRow);
    var anyWarn = (D.skip || []).length || (D.warnings || []).length;
    $("warnH").hidden = !anyWarn; $("warns").hidden = !anyWarn;
    $("warns").innerHTML = (D.skip || []).length ? '<p class="m" style="margin:0 0 4px">' + esc(T("skipNote")) + "</p>" + D.skip.map(skipRow).join("") :
      (D.warnings || []).length ? D.warnings.map(warnRow).join("") : '<div class="empty">' + esc(T("none")) + "</div>";
  }
  $("lang").onclick = function () { LANG = LANG === "es" ? "en" : "es"; try { localStorage.setItem("sy-lang", LANG); } catch (e) {} render(); };
  $("plan").onclick = function (ev) { var b = ev.target.closest(".sw"); if (b) { var n = b.dataset.n; swapped[n] = !swapped[n]; drawPlan(); } };
  render();
  fetch("today.json?t=" + Date.now()).then(function (r) { if (!r.ok) throw 0; return r.json(); }).then(function (d) { PLAN = d; drawPlan(); }).catch(function () {});
  fetch("data.json?t=" + Date.now()).then(function (r) { if (!r.ok) throw 0; return r.json(); }).then(function (d) { D = d; render(); drawPlan(); }).catch(function () {});
})();
</script>
