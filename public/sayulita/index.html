<style>
:root {
  --bg: #fff6f0; --card: #ffffff; --ink: #2a1d17; --muted: #6b5649; --label: #7a6457; --line: #f0dfd3; --line2: #f3e6dc; --edge: #e6d3c6;
  --accent: #d2462f; --accent-ink: #b8361f; --accent-soft: #fde6e0;
  --sea: #0d6e6b; --sea-soft: #e3f3f2; --sea-ink: #0b4f4d;
  --sun-soft: #fff8e6; --sun-ink: #8a5a00;
  --flag1: #e8553d; --flag2: #f2b632; --flag3: #127f7c; --flag4: #d9468f; --flag5: #7cb342;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1a1412; --card: #251d1a; --ink: #f6ece2; --muted: #b8a598; --label: #b8a598; --line: #3a2e29; --line2: #33291f; --edge: #4a3b34;
    --accent: #e8664f; --accent-ink: #ff8a73; --accent-soft: #3d2420;
    --sea: #4fc1bc; --sea-soft: #15302f; --sea-ink: #bfe9e6;
    --sun-soft: #33280f; --sun-ink: #f2c25b;
  }
}
:root[data-theme="dark"] {
  --bg: #1a1412; --card: #251d1a; --ink: #f6ece2; --muted: #b8a598; --label: #b8a598; --line: #3a2e29; --line2: #33291f; --edge: #4a3b34;
  --accent: #e8664f; --accent-ink: #ff8a73; --accent-soft: #3d2420;
  --sea: #4fc1bc; --sea-soft: #15302f; --sea-ink: #bfe9e6;
  --sun-soft: #33280f; --sun-ink: #f2c25b;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 64px; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.45 "DM Sans", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
a { color: var(--sea); }
.wrap { max-width: 640px; margin: 0 auto; padding-bottom: 32px; }
.flags { height: 10px; background: repeating-linear-gradient(90deg, var(--flag1) 0 20px, var(--flag2) 20px 40px, var(--flag3) 40px 60px, var(--flag4) 60px 80px, var(--flag5) 80px 100px); }
header { padding: 20px 16px 12px; display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
h1 { margin: 0; font: 800 38px/1 Fraunces, Georgia, serif; letter-spacing: -.01em; }
h1 span { color: var(--accent); }
.stamp { margin: 6px 0 0; font-size: 13px; color: var(--muted); }
.lang { flex: 0 0 auto; min-width: 44px; height: 44px; border-radius: 99px; border: 1px solid var(--edge); background: var(--card); font: 700 13px "DM Sans", sans-serif; color: var(--ink); cursor: pointer; }
.lbl { font: 700 11px/1 "DM Sans", sans-serif; letter-spacing: .08em; text-transform: uppercase; color: var(--label); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; }
.beach { margin: 0 16px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.beach .card { padding: 8px 6px; text-align: center; min-width: 0; }
.beach .lbl { font-size: 9px; }
.beach b { display: block; font: 800 15px/1.2 Fraunces, Georgia, serif; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.beach small { display: block; font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cc[hidden], #ccFoot[hidden] { display: none; }
.cc { margin: 12px 16px 0; padding: 12px 14px; display: flex; gap: 12px; align-items: center; text-decoration: none; color: inherit; }
.cc .ico { flex: 0 0 40px; height: 40px; border-radius: 12px; background: var(--sea-soft); display: grid; place-items: center; font-size: 20px; }
.cc p { margin: 0; }
.cc .ttl::after { content: " →"; color: var(--sea); }
nav { position: sticky; top: 0; z-index: 5; margin-top: 14px; padding: 8px 16px; background: var(--bg); border-bottom: 1px solid var(--line); display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
nav a { flex: 0 0 auto; text-decoration: none; padding: 10px 14px; border-radius: 99px; background: var(--card); border: 1px solid var(--edge); color: var(--ink); font-weight: 700; font-size: 14px; }
nav a.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
section.s { margin: 28px 16px 0; scroll-margin-top: 64px; }
.h2 { font: 800 24px/1.1 Fraunces, Georgia, serif; margin: 0; }
.hd { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.hd small { font-size: 12px; color: var(--muted); text-align: right; }
.note { margin: 4px 0 10px; font-size: 13px; color: var(--muted); }
.chips { margin-top: 10px; display: flex; gap: 6px; flex-wrap: wrap; }
.chips button { height: 36px; padding: 0 12px; border-radius: 99px; border: 1px solid var(--edge); background: var(--card); color: var(--ink); font: 700 13px "DM Sans", sans-serif; cursor: pointer; }
.chips button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chips button span { opacity: .55; font-weight: 500; margin-left: 3px; }
.list { margin-top: 10px; }
.row { display: flex; gap: 12px; padding: 12px 14px; border-top: 1px solid var(--line2); align-items: flex-start; }
.row:first-child { border-top: 0; }
.row.past { opacity: .45; }
.row.sunset { background: var(--sun-soft); }
.row.sunset .time, .row.sunset .ttl { color: var(--sun-ink); }
.card > .row:first-child { border-top-left-radius: 14px; border-top-right-radius: 14px; }
.card > .row:last-child { border-bottom-left-radius: 14px; border-bottom-right-radius: 14px; }
.time { flex: 0 0 58px; font: 700 13px/1.25 "DM Sans", sans-serif; color: var(--accent-ink); }
.time span { display: block; font-weight: 400; color: var(--muted); }
.row > div:last-child { flex: 1; min-width: 0; }
.ttl { font: 700 15px/1.3 "DM Sans", sans-serif; margin: 0; overflow-wrap: anywhere; }
.sub { font-size: 13px; line-height: 1.4; color: var(--muted); margin: 2px 0 0; overflow-wrap: anywhere; }
.pill { font: 700 11px/1 "DM Sans", sans-serif; padding: 4px 8px; border-radius: 99px; display: inline-block; vertical-align: 2px; margin-left: 4px; }
.pill.deal { background: var(--sea-soft); color: var(--sea); }
.pill.src { background: var(--line); color: var(--muted); font-weight: 500; }
.empty { padding: 14px; color: var(--muted); font-size: 14px; }
.stale { margin-top: 10px; padding: 10px 12px; border-radius: 10px; background: var(--sun-soft); color: var(--sun-ink); font-size: 13px; }
.hero { margin: 16px 16px 0; padding: 16px; border-radius: 16px; background: var(--accent); color: #fff; }
.hero .top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.hero .pill { background: #fff; color: #b8361f; margin: 0; }
.hero h2 { margin: 10px 0 4px; font: 800 24px/1.1 Fraunces, Georgia, serif; }
.hero p { margin: 0; font-size: 14px; }
.hero .today { margin-top: 12px; padding: 10px 12px; border-radius: 10px; background: rgba(0,0,0,.18); font-size: 13px; }
.hero .today ul { margin: 4px 0 0; padding: 0; list-style: none; }
.hero .today li { display: flex; gap: 8px; padding: 2px 0; }
.hero .today li b { flex: 0 0 52px; }
.hero .links { margin-top: 12px; display: flex; gap: 14px; font-size: 13px; font-weight: 700; }
.hero a { color: #fff; }
.hero details summary { cursor: pointer; }
.hero details ul { margin: 6px 0 0; padding: 0; list-style: none; font-size: 13px; }
.hero details li.d { font-weight: 700; margin-top: 8px; }
.cash { margin: 16px 16px 0; padding: 12px 14px; border-radius: 12px; background: var(--sea-soft); display: flex; gap: 10px; align-items: flex-start; }
.cash .lbl { color: var(--sea); flex: 0 0 auto; padding-top: 3px; }
.cash p { margin: 0; font-size: 13px; line-height: 1.45; color: var(--sea-ink); }
.day { font: 800 15px/1 Fraunces, Georgia, serif; margin: 14px 0 8px; }
.more { margin-top: 12px; width: 100%; height: 44px; border-radius: 12px; border: 1px solid var(--edge); background: var(--card); color: var(--ink); font: 700 14px "DM Sans", sans-serif; cursor: pointer; }
.fest { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; }
.fest .card { padding: 14px; display: flex; gap: 14px; }
.badge { flex: 0 0 52px; text-align: center; padding: 6px 0; border-radius: 10px; background: var(--accent-soft); align-self: flex-start; }
.badge .lbl { color: var(--accent-ink); }
.badge b { display: block; font: 800 22px/1.1 Fraunces, Georgia, serif; color: var(--accent-ink); }
.fest details summary { cursor: pointer; color: var(--sea); font-size: 13px; margin-top: 6px; }
.fest details ul { margin: 6px 0 0; padding: 0; list-style: none; font-size: 13px; }
.fest details li { padding: 3px 0; border-top: 1px solid var(--line2); }
.fest details li.d { font-weight: 700; border: 0; padding-top: 8px; }
footer { margin: 32px 16px 0; padding: 16px 0 0; border-top: 1px solid var(--line); font-size: 13px; color: var(--muted); }
footer .links { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-top: 10px; }
</style>
</head>
<body>
<div class="flags" aria-hidden="true"></div>
<main class="wrap">
  <header>
    <div>
      <h1>Sayulita <span>hoy</span></h1>
      <p class="stamp" id="stamp">Loading…</p>

  <section class="s" id="fiestas">
    <h2 class="h2" data-i="fiestas"></h2>
    <div class="fest" id="festList"></div>
  </section>

  <footer>

    <div class="links">

      <a href="https://whistlerbrew.com/projects">whistlerbrew.com</a>
    </div>
  </footer>
</main>

    }
    $("bSun").textContent = time12(hhmm(b.sunset));
    $("bSun2").textContent = T("rise") + " " + time12(hhmm(b.sunrise));
    $("bWater").textContent = Math.round(b.sst) + "°C";
    $("bWater2").textContent = cToF(b.sst) + "°F · " + T("uv") + " " + Math.round(b.uv);
  }
  function loadBeach() {
    var q = "latitude=" + LAT + "&longitude=" + LON + "&timezone=America%2FMexico_City&forecast_days=2";
    Promise.all([
      fetch("https://marine-api.open-meteo.com/v1/marine?" + q + "&hourly=wave_height,wave_period,swell_wave_direction,sea_level_height_msl,sea_surface_temperature").then(function (r) { return r.json(); }),
      fetch("https://api.open-meteo.com/v1/forecast?" + q + "&daily=sunrise,sunset,uv_index_max&current=temperature_2m").then(function (r) { return r.json(); })
    ]).then(function (res) {
      var m = res[0].hourly, w = res[1];
      var now = new Intl.DateTimeFormat("sv-SE", { timeZone: TZ, year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit" }).format(new Date()).replace(" ", "T") + ":00";
      var i = Math.max(0, m.time.indexOf(now)), lvl = m.sea_level_height_msl, next = null;
      for (var j = Math.max(1, i + 1); j < lvl.length - 1; j++) {
        if (lvl[j] > lvl[j - 1] && lvl[j] >= lvl[j + 1]) { next = { kind: "high", time: m.time[j] }; break; }
        if (lvl[j] < lvl[j - 1] && lvl[j] <= lvl[j + 1]) { next = { kind: "low", time: m.time[j] }; break; }
      }
      BEACH = { wave: m.wave_height[i], period: m.wave_period[i], dir: m.swell_wave_direction[i], sst: m.sea_surface_temperature[i],
        nextTide: next, rising: lvl[i + 1] > lvl[i], sunset: w.daily.sunset[0], sunrise: w.daily.sunrise[0 + (w.daily.sunrise[0] < now ? 1 : 0)] || w.daily.sunrise[0],
        uv: w.daily.uv_index_max[0] };
      drawBeach(); render();
    }).catch(function () {});
  }

  // ---------------------------------------------------------------- rows
  function timeCell(start, end) {
    if (!start) return '<div class="time">' + esc(T("allDay")) + "</div>";
    return '<div class="time">' + esc(time12(start)) + (end && end !== start ? "<span>–" + esc(time12(end)) + "</span>" : "") + "</div>";
  }
  function isPast(start, end) {
    var e = mins(end), s = mins(start);
    if (e != null && s != null && e < s) e += 1440; // runs past midnight
    var stop = e != null ? e : s != null ? s + 120 : null;
    return stop != null && stop < NOW.min;
  }
  function todayRow(x) {
    if (x.kind === "sunset") return '<div class="row sunset"><div class="time">' + esc(time12(x.start)) + '</div><div><p class="ttl">🌅 ' + esc(T("sunsetRow")) + "</p></div></div>";
    var past = isPast(x.start, x.end) ? " past" : "";
    if (x.kind === "deal") {
      var h = x.item;
      return '<div class="row' + past + '">' + timeCell(h.start, h.end) + '<div><p class="ttl">' + esc(h.venue) + ' <span class="pill deal">' + esc(T("deal")) +
        '</span></p><p class="sub">' + esc([tr(h.deal), tr(h.days)].filter(Boolean).join(" · ")) + go(h.venue) + "</p></div></div>";
    }
    var e = x.item;
    return '<div class="row' + past + '">' + timeCell(e.start, e.end) + '<div><p class="ttl">' + esc(tr(e.title)) + '</p><p class="sub">' +
      esc(e.venue || "") + link(e.url) + go(e.venue) + "</p></div></div>";
  }
  function eventRow(e) {
    var meta = [e.venue, e.end ? T("until") + " " + time12(e.end) : ""].filter(Boolean).join(" · ");
    return '<div class="row">' + timeCell(e.start) + '<div><p class="ttl">' + esc(tr(e.title)) + '</p><p class="sub">' + esc(meta) + link(e.url) + go(e.venue) + "</p></div></div>";
  }
  function dowText(dows) {
    if (dows.length === 7) return T("daily");
    return dows.map(DOW_SHORT).join("<br>");
  }
  function weeklyRow(w) {
    var time = w.start ? time12(w.start) + (w.end && w.end !== w.start ? "–" + time12(w.end) : "") : "";
    return '<div class="row"><div class="time">' + dowText(w.dows) + '</div><div><p class="ttl">' + esc(tr(w.title)) + '</p><p class="sub">' +
      esc([w.venue, time].filter(Boolean).join(" · ")) + link(w.url) + go(w.venue) + "</p></div></div>";
  }
  function usualRow(h) {
    var time = h.start ? time12(h.start) + (h.end && h.end !== h.start ? "–" + time12(h.end) : "") : "";
    return '<div class="row"><div class="time">' + esc(tr(h.days) || T("daily")) + '</div><div><p class="ttl">' + esc(h.venue) + ' <span class="pill deal">' + esc(T("deal")) +
      '</span></p><p class="sub">' + esc([tr(h.deal), time].filter(Boolean).join(" · ")) + go(h.venue) + "</p></div></div>";
  }
  function progList(rows) {
    return rows.map(function (r) { return "<li>" + (r.time ? "<b>" + esc(time12(r.time)) + "</b> " : "") + "<span>" + esc(tr(r.title)) + (r.where ? " · " + esc(r.where) : "") + "</span></li>"; }).join("");
  }
  function byDay(rows) {
    var days = {}, order = [];
    rows.forEach(function (r) { if (!days[r.date]) { days[r.date] = []; order.push(r.date); } days[r.date].push(r); });
    return order.map(function (d) { return '<li class="d">' + esc(fmtDay(d, { weekday: "long", month: "short", day: "numeric" })) + "</li>" + progList(days[d]); }).join("");
  }
  function heroHtml(f) {
    var end = f.end || f.start, n = Math.round((day(end) - day(f.start)) / 864e5) + 1, k = Math.round((day(todayIso) - day(f.start)) / 864e5) + 1;
    var sched = (f.schedule || []).slice().sort(function (a, b) { return (a.date + (a.time || "")).localeCompare(b.date + (b.time || "")); });
    var today = sched.filter(function (r) { return r.date === todayIso; }), later = sched.filter(function (r) { return r.date > todayIso; });
    var range = fmtDay(f.start, { month: "short", day: "numeric" }) + (end !== f.start ? "–" + fmtDay(end, { day: "numeric" }) : "");
    return '<section class="hero"><div class="top"><span class="pill">' + esc(T("onNow") + (n > 1 ? " · " + T("dayOf").replace("{a}", k).replace("{b}", n) : "")) +
      '</span><span class="lbl" style="color:#fff">' + esc(range) + "</span></div><h2>" + esc(tr(f.title)) + "</h2>" +
      (f.note || f.where ? "<p>" + esc([tr(f.note), f.where].filter(Boolean).join(" · ")) + "</p>" : "") +
      (today.length ? '<div class="today"><strong>' + esc(T("todayProg")) + "</strong><ul>" + progList(today) + "</ul></div>" : "") +
      '<div class="links">' + (later.length ? "<details><summary>" + esc(T("fullProg")) + "</summary><ul>" + byDay(later) + "</ul></details>" : "") +
      (f.url ? '<a href="' + esc(f.url) + '" rel="noopener" target="_blank">' + esc(T("details")) + "</a>" : "") + "</div></section>";
  }
  function festRow(f) {
    var sched = (f.schedule || []).filter(function (r) { return r.date >= todayIso; });
    var end = f.end && f.end !== f.start ? " – " + fmtDay(f.end, { month: "short", day: "numeric" }) : "";
    return '<div class="card"><div class="badge"><div class="lbl">' + esc(fmtDay(f.start, { month: "short" })) + "</div><b>" + esc(fmtDay(f.start, { day: "numeric" })) +
      '</b></div><div><p class="ttl">' + esc(tr(f.title)) + '</p><p class="sub">' + esc([fmtDay(f.start, { month: "short", day: "numeric" }) + end, f.where, tr(f.note)].filter(Boolean).join(" · ")) +
      link(f.url) + "</p>" + (sched.length ? "<details><summary>" + esc(T("byDay")) + "</summary><ul>" + byDay(sched) + "</ul></details>" : "") + "</div></div>";
  }

  // ---------------------------------------------------------------- render
  var DATA = null, chip = pick("sy-chip", "all"), showAll = false;
  function render() {
    NOW = partsNow(); todayIso = NOW.iso;
    document.documentElement.lang = LANG;
    $("lang").textContent = LANG === "es" ? "EN" : "ES";
    $("lang").setAttribute("aria-label", LANG === "es" ? "English" : "Español");
    [].forEach.call(document.querySelectorAll("[data-i]"), function (el) { el.textContent = T(el.dataset.i); });
    drawBeach();
    if (!DATA) return;
    var d = DATA;
    $("stamp").textContent = fmtDay(todayIso, { weekday: "short", month: "short", day: "numeric" }) + (d.updated ? " · " + T("updated") + " " + ago(d.updated) : "");
    if (d.cash_tip) { $("cashText").textContent = tr(d.cash_tip); $("cash").hidden = false; }

    // hero: festivals on right now
    // two sources often name one festival differently ("Longboard Competition" / "Longboard Contest 2026"): keep the richer one
    var fests = [];
    (d.festivals || []).filter(function (f) { return (f.end || f.start) >= todayIso; })
      .sort(function (a, b) { return (b.schedule || []).length - (a.schedule || []).length; })
      .forEach(function (f) {
        var key = f.title.toLowerCase().replace(/[^a-z0-9 ]/g, "").split(" ").slice(0, 2).join(" ");
        if (!fests.some(function (g) { return g.start === f.start && g.title.toLowerCase().replace(/[^a-z0-9 ]/g, "").indexOf(key) === 0; })) fests.push(f);
      });
    var onNow = fests.filter(function (f) { return f.start <= todayIso; });
    $("hero").innerHTML = onNow.map(heroHtml).join("");

    // today: deals that run today + today's events + sunset, by time
    var events = (d.events || []).filter(function (e) { return e.date >= todayIso; });
    var deals = (d.happy_hours || []).filter(dealToday);
    var items = deals.map(function (h) { return { kind: "deal", group: (h.type || "drink") === "food" ? "food" : "drink", start: h.start, end: h.end, item: h }; })
      .concat(events.filter(function (e) { return e.date === todayIso; }).map(function (e) { return { kind: "event", group: evGroup(e), start: e.start, end: e.end, item: e }; }));
    var counts = { all: items.length };
    items.forEach(function (x) { counts[x.group] = (counts[x.group] || 0) + 1; });
    $("chips").innerHTML = ["all", "drink", "music", "food", "active"].map(function (k) {
      return '<button type="button" data-k="' + k + '" aria-pressed="' + (k === chip) + '">' + esc(T(k)) + "<span>" + (counts[k] || 0) + "</span></button>";
    }).join("");
    var shown = items.filter(function (x) { return chip === "all" || x.group === chip; });
    if (BEACH && (chip === "all" || chip === "drink")) shown.push({ kind: "sunset", start: hhmm(BEACH.sunset) });
    shown.sort(function (a, b) { return (a.start || "00:00").localeCompare(b.start || "00:00"); });
    $("todayList").innerHTML = shown.length ? shown.map(todayRow).join("") : '<div class="empty">' + esc(T("emptyToday")) + "</div>";
    var wa = d.feeds && d.feeds.whatsapp;
    $("staleNote").innerHTML = wa && Date.now() - new Date(wa).getTime() > 2 * 864e5
      ? '<div class="stale">' + esc(T("stale").replace("{d}", fmtDay(wa.slice(0, 10), { weekday: "short", month: "short", day: "numeric" }))) + "</div>" : "";

    // this week: one-off events after today; later dates behind a button
    var later = events.filter(function (e) { return e.date > todayIso && !e.recurring; })
      .sort(function (a, b) { return (a.date + (a.start || "")).localeCompare(b.date + (b.start || "")); });
    var cut = addDays(todayIso, 7), first = later.filter(function (e) { return e.date < cut; }), rest = later.filter(function (e) { return e.date >= cut; });
    function group(list) {
      var days = {}, order = [];
      list.forEach(function (e) { if (!days[e.date]) { days[e.date] = []; order.push(e.date); } days[e.date].push(e); });
      return order.map(function (dd) { return '<p class="day">' + esc(fmtDay(dd, { weekday: "short", day: "numeric", month: rest.indexOf(days[dd][0]) >= 0 ? "short" : undefined })) + '</p><div class="card">' + days[dd].map(eventRow).join("") + "</div>"; }).join("");
    }
    var weekHtml = group(first.concat(showAll ? rest : []));
    $("weekList").innerHTML = weekHtml || '<div class="card"><div class="empty">' + esc(T("emptyWeek")) + "</div></div>";
    $("moreBtn").hidden = !rest.length;
    $("moreBtn").textContent = showAll ? T("showLess") : T("showMore").replace("{n}", rest.length);

    // every week: recurring events, then standing happy hours
    var weekly = (d.weekly || []).map(weeklyRow).concat((d.happy_hours || []).filter(function (h) { return h.usual; }).map(usualRow));
    $("weeklyList").innerHTML = weekly.length ? weekly.join("") : '<div class="empty">' + esc(T("emptyWeekly")) + "</div>";

    var future = fests.filter(function (f) { return f.start > todayIso; }).sort(function (a, b) { return a.start.localeCompare(b.start); });
    $("festList").innerHTML = future.length ? future.map(festRow).join("") : '<div class="card"><div class="empty">' + esc(T("emptyFest")) + "</div></div>";
  }
  $("chips").onclick = function (ev) { var b = ev.target.closest("button"); if (b) { chip = b.dataset.k; keep("sy-chip", chip); render(); } };
  $("moreBtn").onclick = function () { showAll = !showAll; render(); };
  $("lang").onclick = function () { LANG = LANG === "es" ? "en" : "es"; keep("sy-lang", LANG); render(); };
  // highlight the nav chip for the section in view
  if ("IntersectionObserver" in window) {
    var io = new IntersectionObserver(function (es) {
      es.forEach(function (x) { if (x.isIntersecting) [].forEach.call($("nav").children, function (a) { a.classList.toggle("on", a.getAttribute("href") === "#" + x.target.id); }); });
    }, { rootMargin: "-40% 0px -55% 0px" });
    ["today", "week", "weekly", "fiestas"].forEach(function (id) { io.observe($(id)); });
  }
  render();
  loadBeach();
  fetch("concierge/data.json", { method: "HEAD" }).then(function (r) { if (r.ok) { $("cc").hidden = false; $("ccFoot").hidden = false; } }).catch(function () {});
  setInterval(render, 5 * 60000);
  fetch("data.json?t=" + Date.now()).then(function (r) { return r.json(); }).then(function (dd) {
    DATA = dd; ES = dd.es || {}; render();
  }).catch(function () { $("stamp").textContent = T("loadFail"); });
})();
</script>
</body>
</html>
